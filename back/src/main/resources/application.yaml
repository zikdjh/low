server:
  port: 8080

spring:
  application:
    name: back

  config:
    import:
      - classpath:application-datasource.yaml

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB

# 自定义 JWT / 鉴权配置
auth:
  jwt:
    issuer: lowcode-platform
    secret: 6f8a3b1d2c4e5f7088aa11bb22cc33dd44ee55ff66778899aa00bbccddeeff11
    # access token：45 分钟（与前端 sessionStorage 中 expiresAt 保持一致）
    access-expire-minutes: 45
    # refresh token：7 天，写入 HttpOnly Cookie
    refresh-expire-days: 7
  cookie:
    refresh-name: refresh_token
    # 本地开发用 false；上线 https 改 true
    secure: false
    same-site: Lax
